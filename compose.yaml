services:
  db:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: hologram-beamops-kanban:verified
    command:
      - "/app/bin/hologram_beamops_kanban"
      - "eval"
      - "HologramBeamOpsKanban.Release.migrate()"
    env_file:
      - .env.docker
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: hologram-beamops-kanban:verified
    restart: unless-stopped
    env_file:
      - .env.docker
    networks:
      - app_network
      - edge_network
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4000:4000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  app_network:
    internal: true
  edge_network:
    driver: bridge
